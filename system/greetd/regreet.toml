# ReGreet -- the greeter itself. Installed to /etc/greetd/regreet.toml.
#
# NOT managed by chezmoi (root-owned, outside $HOME). See the README.
#
# Everything referenced here must be readable by the `greeter` user, which
# cannot see inside /home/djpro (mode 700). So the wallpaper, cursor theme and
# icon theme are copied into /usr/share rather than pointed at ~/.icons,
# ~/.local/share/icons or ~/Pictures. If the greeter comes up with a default
# cursor or no background, that is the cause.

[background]
# No extension: install.sh stages whatever format that machine's wallpaper is
# (PNG on the laptop, JPEG on the desktop) under this one name, and GdkPixbuf
# identifies it by content rather than by suffix.
path = "/usr/share/backgrounds/regreet-wallpaper"
# Fill the screen, cropping rather than stretching. install.sh stages a
# wallpaper matching the shape of the machine it runs on -- 16:9 on the
# desktop, 16:10 on the laptop -- so in practice nothing is cropped either.
fit = "Cover"

[GTK]
# Dark to match the rest of the desktop.
application_prefer_dark_theme = true

# Copied to /usr/share/icons so the greeter and the session use the same
# pointer, otherwise the cursor visibly changes at login.
cursor_theme_name = "Posy_Cursor_Black"

# Same font as the GTK apps in-session.
font_name = "Noto Sans 12"

# Also copied to /usr/share/icons.
icon_theme_name = "YAMIS"

# Widget theme. Breeze ships system-wide already, so it needs no copying.
theme_name = "Breeze"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
