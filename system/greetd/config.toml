# greetd -- login manager. Installed to /etc/greetd/config.toml.
#
# NOT managed by chezmoi: it lives outside $HOME and is root-owned. The copy in
# this repo is the source of truth; see the README for the install command.
#
# ReGreet is a GTK application, so it needs a Wayland compositor to draw in.
# That used to be cage, but cage cannot describe monitors -- it only extends
# across every output, which on this dual-4K setup put the prompt across the
# bezel seam and stretched the background over both screens. Hyprland is used
# instead so the greeter gets the same modes, scales and positions as the
# session. See hyprland.lua.

[terminal]
# The VT the greeter takes over. 1 is the one you land on at boot.
vt = 1

[default_session]
# Hyprland exits as soon as regreet does; see the hyprland.start handler in
# hyprland.lua. The config is Lua rather than hyprlang because Hyprland calls a
# .conf "legacy config" and says so on screen, which on a greeter means a
# deprecation warning sits over the login prompt.
#
# Ctrl+Alt+F2 remains the escape hatch to a text login if this ever fails.
command = "Hyprland --config /etc/greetd/hyprland.lua"

# Unprivileged user the greeter runs as, created by the greetd package. This
# is why the greeter cannot read anything under /home/djpro -- wallpaper,
# cursor and icon themes have to live somewhere world-readable. See
# regreet.toml.
user = "greeter"
