# Compositor for the login screen. Installed to /etc/greetd/hyprland.conf.
#
# Hyprland rather than cage, because cage has no way to describe monitors: it
# only offers "extend across everything" (the default) or "use whichever
# connected last". Extend builds one output space ~7680px wide across both 4K
# panels, so ReGreet centres itself across the bezel seam and its background is
# stretched over both screens. That is the scuffed layout.
#
# This is hyprlang, NOT Lua -- deliberately. It is a throwaway config for one
# program, and hyprlang keeps `hyprctl dispatch exit` working with the classic
# syntax. The session config in ~/.config/hypr is Lua and unrelated to this.
#
# Keep the monitor lines in sync with hypr/monitors.lua.

# AOC U32G4, 32" -- primary, the login prompt appears here.
monitor = DP-2, 3840x2160@160, 0x0, 1.25

# Dell U2725QE, 27". Left enabled so it is not a dead black panel at boot,
# but nothing is placed on it.
monitor = DP-1, 3840x2160@120, 3072x144, 1.5

# Anything else that gets plugged in.
monitor = , preferred, auto, 1

# Run the greeter, then tear the compositor down as soon as it exits --
# otherwise greetd would sit on an empty Hyprland after login.
exec-once = regreet; hyprctl dispatch exit

# A single fullscreen window: no gaps, borders or rounding to give it away.
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

# Nothing to animate, and it makes the greeter appear instantly.
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # The greeter's config never changes while it runs.
    disable_autoreload = true
}

input {
    kb_layout = us
    numlock_by_default = true
}

# Copied to /usr/share/icons by install.sh, since the greeter user cannot read
# /home/djpro. Without this the login screen uses the default X cursor and then
# visibly changes once the session starts.
env = XCURSOR_THEME,Posy_Cursor_Black
env = XCURSOR_SIZE,32
