# Lid switch behaviour. Installed to
# /etc/systemd/logind.conf.d/99-lid.conf by install.sh in this directory.
#
# A drop-in rather than an edit to /etc/systemd/logind.conf, so a systemd
# upgrade cannot drop a .pacnew on top of it.
#
# WHY THIS FILE EXISTS AT ALL: two of the three settings below are already the
# systemd defaults. It is here to be explicit and version-controlled, because
# clamshell mode is split across two programs -- Hyprland turns the panel off
# (hypr/hosts/LAPTOP-ON9AU/binds.lua) and logind decides whether the machine
# suspends out from under it -- and a default that silently changes would break
# the half that is not written down anywhere.

[Login]

# Lid shut, nothing else plugged in: suspend. The default, and the right
# answer -- the alternative is a laptop cooking itself in a bag.
HandleLidSwitch=suspend

# Same on mains. Deliberately NOT following hypridle's "never suspend on AC"
# rule (see hypr/hypridle.conf): that rule is about an idle machine with the
# screen in front of you, and it exists so the desktop keeps docker and
# tailscale up. A closed lid is a different signal -- it means you have walked
# away and shut the thing.
HandleLidSwitchExternalPower=suspend

# Lid shut with an external display attached: do nothing, and let Hyprland
# disable the panel instead.
#
# This is the line that makes clamshell work. logind counts "docked" as being
# in a docking station OR having more than one display connected, which is the
# same condition as the `#hl.get_monitors() > 1` guard on the Hyprland side --
# so the two agree without either having to know about the other.
#
# Also already the systemd default. Stated anyway, because everything else here
# depends on it.
HandleLidSwitchDocked=ignore
