# qt6ct -- theming for Qt6 apps (Dolphin, Gwenview, Okular, Kate) outside
# Plasma. Activated by QT_QPA_PLATFORMTHEME=qt6ct in ~/.config/uwsm/env.
#
# Why not KDE's own platform theme: QT_QPA_PLATFORMTHEME=kde themes these apps
# correctly but breaks KIO's ability to resolve a default application, so
# opening a file puts up an empty "Open With" dialog. qt6ct was checked
# against that same test and opens files 3/3. See the README.
#
# Edit interactively with `qt6ct` -- it rewrites this file, so re-add it to
# chezmoi afterwards:
#   chezmoi add ~/.config/qt6ct/qt6ct.conf

[Appearance]
# Fusion rather than Kvantum, because Fusion honours the palette below while
# Kvantum paints its own colours and ignores it. That is the whole point here:
# Dolphin now uses the same Catppuccin Mocha colours as kitty, waybar, fuzzel
# and swaync, instead of the unrelated Dream-Violet-Dark Kvantum theme.
#
# To go back to Kvantum: style=kvantum and custom_palette=false. The Kvantum
# theme itself is still configured, via `kvantummanager`.
style=Fusion

custom_palette=true
color_scheme_path=/home/djpro/.config/qt6ct/colors/catppuccin-mocha.conf

# Matches the GTK icon theme, so Qt and GTK apps look like one desktop.
icon_theme=YAMIS

# Use the toolkit's own file dialogs rather than the portal's. KDE apps then
# get KDE file dialogs, which is what you want when the file manager is
# Dolphin.
standard_dialogs=default

[Interface]
# Qt's defaults, spelled out so `qt6ct` does not treat the file as incomplete.
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

# Fonts are stored as serialised Qt blobs, which cannot sensibly be written by
# hand -- set them in the `qt6ct` GUI if the defaults do not match the rest of
# the desktop (Noto Sans 10 / Fira Code Nerd Font 10).
