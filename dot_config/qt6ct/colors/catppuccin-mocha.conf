# Catppuccin Mocha palette for Qt apps, to match kitty, waybar, fuzzel and
# swaync. Selected via color_scheme_path in qt6ct.conf.
#
# Each line is 21 colours in QPalette role order, #aarrggbb:
#
#   0  WindowText      7  BrightText      14 Link
#   1  Button          8  ButtonText      15 LinkVisited
#   2  Light           9  Base            16 AlternateBase
#   3  Midlight       10  Window          17 NoRole
#   4  Dark           11  Shadow          18 ToolTipBase
#   5  Mid            12  Highlight       19 ToolTipText
#   6  Text           13  HighlightedText 20 PlaceholderText
#
# Palette:
#   base     #1e1e2e   surface0 #313244   text     #cdd6f4   mauve #cba6f7
#   mantle   #181825   surface1 #45475a   subtext0 #a6adc8   blue  #89b4fa
#   crust    #11111b   surface2 #585b70   overlay0 #6c7086   red   #f38ba8
#
# This only takes effect with a palette-aware style: Fusion honours it,
# Kvantum ignores it and paints its own colours.

[ColorScheme]
active_colors=#ffcdd6f4, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ffcdd6f4, #fff38ba8, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ffcba6f7, #ff11111b, #ff89b4fa, #ffcba6f7, #ff181825, #ff000000, #ff313244, #ffcdd6f4, #806c7086
inactive_colors=#ffcdd6f4, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ffcdd6f4, #fff38ba8, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ff585b70, #ffcdd6f4, #ff89b4fa, #ffcba6f7, #ff181825, #ff000000, #ff313244, #ffcdd6f4, #806c7086
disabled_colors=#ff6c7086, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ff6c7086, #fff38ba8, #ff6c7086, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ff45475a, #ff6c7086, #ff6c7086, #ff6c7086, #ff181825, #ff000000, #ff313244, #ffcdd6f4, #806c7086
