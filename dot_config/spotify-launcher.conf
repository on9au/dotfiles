# spotify-launcher config.
#
# Spotify ships as a Chromium/CEF app and defaults to X11, so under Hyprland it
# went through XWayland: rendered at the logical size and then upscaled, which
# is why it looked soft and oversized on a 4K panel at scale 1.25.
#
# These flags make it use the Wayland backend directly, so it renders at native
# resolution and picks up the compositor's scale itself. Confirm it took with:
#
#   hyprctl clients -j | jq -r '.[] | select(.class == "Spotify") | .xwayland'
#
# ...which should print false.
#
# Defaults and further options: /etc/spotify-launcher.conf

[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
