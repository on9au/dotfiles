[preferred]
default=hyprland;gtk

# File dialogs come from GTK.
org.freedesktop.impl.portal.FileChooser=gtk

# ...but the "Open With" dialog comes from KDE. The GTK one is what produced
# the mangled picker when a file had no default application: it is styled for
# GNOME, ignores the KDE theming, and lists apps confusingly. Since the file
# manager, image viewer and PDF viewer here are all KDE apps, its chooser is
# the consistent one. Provided by xdg-desktop-portal-kde.
org.freedesktop.impl.portal.AppChooser=kde
