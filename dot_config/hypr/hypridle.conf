# hypridle -- what happens when the machine sits idle.
#
# Timeline:
#   5m00s  lock the session
#   5m30s  turn the monitors off
#
# There is deliberately no `systemctl suspend` listener: this is a desktop
# running docker and tailscale, and suspending would drop both. Add one back
# if you ever want it.
#
# There are also no brightnessctl listeners from the shipped example --
# desktop monitors have no software backlight, and brightnessctl is not
# installed.
#
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # `pidof` guard stops a second hyprlock spawning on top of the first.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine sleeps, so it never resumes unlocked.
    before_sleep_cmd = loginctl lock-session

    # Wake the screens on resume without needing a keypress.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
