# Disable fcitx5's Status Notifier addon -- the tray icon / language picker.
#
# waybar's tray module has no per-item ignore list, so the icon has to be
# switched off at the source rather than filtered out of the bar.
#
# The input method itself is unaffected: SUPER+Space still switches between
# keyboard-us, pinyin and mozc, and fcitx5-configtool still works for changing
# settings. This only removes the tray indicator.
#
# Overrides /usr/share/fcitx5/addon/notificationitem.conf
[Addon]
Enabled=False
